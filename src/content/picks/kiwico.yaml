tags: ['STEM and building']
summary: A monthly project crate with real materials, one build, and an afternoon of busy hands. Eight lines cover everyone from toddlers to teens, and the sweet spot is ages 3 to 8.
price: From about $19 a crate each month
url: https://www.kiwico.com
limitations: It renews on its own and canceling takes effort. Tweens often find the projects too scripted; a hardware-store allowance buys the same hours for less.
