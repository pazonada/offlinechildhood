name: Kindle Paperwhite Kids
maker: Amazon
kind: Product
tags: ['Books and reading']
summary: An e-reader that does one thing. No apps, no video, no messages, just books on a paper-like screen, in a kid-proof case with a two-year warranty that covers accidents. The kids edition hides ads and blocks the store and browser.
price: Around $160 to $230 depending on sales
url: https://www.amazon.com/All-new-Amazon-Kindle-Paperwhite-Kids/dp/B0CFPS7ZY9
limitations: It ties your kid's reading to an Amazon account, and the bundled six months of Amazon Kids+ auto-renews at $7.99 a month unless you set a reminder to cancel. If you want out of Amazon entirely, the Kobo Clara BW does the same job for $160 and borrows library books easily, without the kid-proof warranty bundle.
updated: 2026-09-18
