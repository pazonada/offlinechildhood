name: The Week Junior
maker: The Week
kind: Service
tags: ['Books and reading']
summary: A weekly printed news magazine for ages 8 to 14 that covers current events without a feed, a comment section, or an algorithm. A kid who reads it knows what happened this week and got there calmly.
price: About $49 for the first 25 issues, then roughly $120 a year
url: https://theweekjunior.com
limitations: The renewal price roughly doubles after the introductory offer unless you call, and the writing aims at 8 and up; younger siblings will mostly look at the pictures.
updated: 2026-09-18
