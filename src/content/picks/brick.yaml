name: Brick
maker: Brick
kind: Product
tags: ['For parents']
summary: A small tap-to-block tile that lives by your door. Tap your own phone on it and the apps you chose disappear until you tap again, which turns willpower into a physical act. This one is for you, because kids copy what they see.
price: $59 once, no subscription
url: https://getbrick.com
limitations: It only works if the brick stays somewhere inconvenient, the app can undo everything in a weak moment, and iPhone system updates occasionally break blocking apps for a few days.
updated: 2026-09-18
