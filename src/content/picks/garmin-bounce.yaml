name: Garmin Bounce 2
maker: Garmin
kind: Product
tags: ['Phones and watches']
summary: A kids' watch with calling, texting, and location for an approved contact list, no social apps, and no third-party monitoring layer. Garmin is a large public company, so the service behind the watch is unlikely to vanish.
price: $299.99, plus $9.99 a month
url: https://www.garmin.com/en-US/p/779781/
limitations: That is real money for a device a kid outgrows in about two years, and the battery lasts roughly two days, so it dies exactly when nobody is watching the charger. Like every kid watch, it shows you your kid's location around the clock; decide how often you will check before it arrives.
updated: 2026-09-18
