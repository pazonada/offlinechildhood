[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# --------------------------------------------------------------------------
# Redirects from the old Squarespace site. Kept in netlify.toml rather than a
# _redirects file because the Astro Netlify adapter owns that file and may
# regenerate it. Specific rules come before the catch-all splats.
# --------------------------------------------------------------------------

# Phone and device entries are more useful pointed at the decision than at a
# product list, since the decision is what the visitor was actually weighing.
[[redirects]]
  from = "/products-services/the-light-phone"
  to = "/decisions/first-phone"
  status = 301

[[redirects]]
  from = "/products-services/gabb-wireless-phones-amp-smartwatch"
  to = "/decisions/first-phone"
  status = 301

[[redirects]]
  from = "/products-services/noble-mobile"
  to = "/decisions/first-phone"
  status = 301

[[redirects]]
  from = "/products-services/category/Communication+devices"
  to = "/decisions/first-phone"
  status = 301

[[redirects]]
  from = "/products-services/tag/Phones"
  to = "/decisions/first-phone"
  status = 301

# Monitoring and parental-control entries have no equivalent on purpose: we do
# not take commission on surveillance software. Send those to the disclosure
# page, which explains why.
[[redirects]]
  from = "/products-services/canopy-online-safety-app"
  to = "/disclosure"
  status = 301

[[redirects]]
  from = "/products-services/bark-products-for-monitoring-kids-digital-consumption"
  to = "/disclosure"
  status = 301

[[redirects]]
  from = "/products-services/category/Parental+control"
  to = "/disclosure"
  status = 301

# Everything else in the old product directory becomes the picks page.
[[redirects]]
  from = "/products-services"
  to = "/picks"
  status = 301

[[redirects]]
  from = "/products-services/*"
  to = "/picks"
  status = 301

# The old resources section was media literacy material.
[[redirects]]
  from = "/resources"
  to = "/conversations"
  status = 301

[[redirects]]
  from = "/resources/*"
  to = "/conversations"
  status = 301

[[redirects]]
  from = "/expertise"
  to = "/trusted"
  status = 301

[[redirects]]
  from = "/community"
  to = "/about"
  status = 301

[[redirects]]
  from = "/home"
  to = "/"
  status = 301
